  <text x="208" y="371" font-family="Montserrat, 'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.9">C.N.A.P.S.</text>
