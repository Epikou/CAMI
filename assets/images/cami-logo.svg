  <text x="208" y="290" font-family="Montserrat, 'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-weight="600" font-size="13.5" letter-spacing="1.2" fill="#ffffff">CABINET MIGLIACCIO INVESTIGATIONS</text>
